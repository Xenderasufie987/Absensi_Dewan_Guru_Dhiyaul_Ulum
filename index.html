<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Absensi Dewan Guru Dhiyaul Ulum</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#087f5b">
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f3f7f5;color:#17352c}
header{background:#087f5b;color:white;padding:20px 18px;border-radius:0 0 24px 24px}
header h1{font-size:21px;margin:0 0 5px}header p{margin:0;opacity:.9;font-size:13px}
main{max-width:620px;margin:auto;padding:16px}.card{background:white;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 4px 16px #0000000d}
h2{font-size:18px;margin:0 0 12px}.clock{font-size:32px;font-weight:800;margin:8px 0}.date{font-size:13px;color:#667}
button{border:0;border-radius:14px;padding:14px 16px;font-weight:700;font-size:15px;cursor:pointer;width:100%;margin-top:9px}
.primary{background:#087f5b;color:white}.danger{background:#d94841;color:white}.secondary{background:#e8f2ee;color:#087f5b}
.status{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:14px;border-radius:14px;background:#f1f6f4}.stat b{font-size:22px;display:block}.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #eee;font-size:14px}
input{width:100%;padding:13px;border:1px solid #ccd8d3;border-radius:12px;margin:6px 0 10px;font-size:15px}
.hidden{display:none}.login{max-width:420px;margin:55px auto;padding:20px}.logo{width:76px;height:76px;border-radius:22px;background:#087f5b;color:white;display:grid;place-items:center;font-size:35px;margin:auto auto 15px}
.small{font-size:12px;color:#6b7d76}
.sync{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;margin-left:6px}
.sync-ok{background:#e3f6ec;color:#087f5b}.sync-pending{background:#fdf1e3;color:#a15c00}
</style></head>
<body>
<div id="login" class="login">
  <div class="logo">DU</div>
  <h2 style="text-align:center">Absensi Dewan Guru Dhiyaul Ulum</h2>
  <p class="small" style="text-align:center">Silakan masuk untuk melakukan absensi.</p>
  <div class="card">
    <label>Nama Guru</label><input id="loginName" placeholder="Contoh: Ahmad">
    <label>Password</label><input id="loginPass" type="password" placeholder="Password">
    <button class="primary" onclick="login()">MASUK</button>
    <p class="small">Demo awal: password <b>123456</b></p>
  </div>
</div>

<div id="app" class="hidden">
<header><h1>Absensi Dewan Guru Dhiyaul Ulum</h1><p id="hello"></p></header>
<main>
  <div class="card">
    <div class="small">Waktu sekarang</div><div class="clock" id="clock">--:--:--</div><div class="date" id="today"></div>
  </div>
  <div class="card">
    <h2>Absensi Hari Ini <span id="netStatus" class="sync sync-ok">Online</span></h2>
    <div class="status">
      <div class="stat"><span>Masuk</span><b id="inTime">-</b></div>
      <div class="stat"><span>Pulang</span><b id="outTime">-</b></div>
    </div>
    <button id="inBtn" class="primary" onclick="attendance('masuk')">🟢 ABSEN MASUK</button>
    <button id="outBtn" class="danger" onclick="attendance('pulang')">🔴 ABSEN PULANG</button>
    <button class="secondary" onclick="locationInfo()">📍 CEK LOKASI</button>
  </div>
  <div class="card">
    <h2>Rekap Bulan Ini</h2>
    <div class="status">
      <div class="stat">Hadir<b id="countH">0</b></div>
      <div class="stat">Hari kerja<b id="countD">0</b></div>
    </div>
  </div>
  <div class="card">
    <h2>Riwayat Absensi</h2><div id="history"></div>
    <button class="secondary" id="syncBtn" onclick="syncPending(true)">🔄 Sinkron Ulang</button>
  </div>
  <button class="secondary" onclick="logout()">Keluar</button>
</main></div>

<script>
/* ====== KONFIGURASI: ganti dengan URL Web App Apps Script kamu ====== */
const CONFIG = {
  SCRIPT_URL: 'PASTE_URL_WEB_APP_APPS_SCRIPT_DI_SINI'
};
/* ===================================================================== */

const KEY='du_absensi_v1', USER='du_user';
let data=JSON.parse(localStorage.getItem(KEY)||'{}');
let current=localStorage.getItem(USER)||'';

function pad(n){return String(n).padStart(2,'0')}
function now(){let d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())}
function key(){let d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function dateText(){return new Intl.DateTimeFormat('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date())}

function login(){
  let n=document.getElementById('loginName').value.trim(), p=document.getElementById('loginPass').value;
  if(!n) return alert('Nama guru harus diisi.');
  if(p!=='123456') return alert('Password demo salah. Gunakan 123456.');
  current=n;localStorage.setItem(USER,current);showApp();
}
function showApp(){
 document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');
 document.getElementById('hello').textContent='Selamat datang, '+current;
 render();
 syncPending(false);
}
function render(){
 document.getElementById('today').textContent=dateText();
 let k=key(), r=data[current]?.[k]||{};
 document.getElementById('inTime').textContent=r.masuk||'-';document.getElementById('outTime').textContent=r.pulang||'-';
 document.getElementById('inBtn').disabled=!!r.masuk;document.getElementById('outBtn').disabled=!!r.pulang;
 document.getElementById('inBtn').style.opacity=r.masuk?.5:1;document.getElementById('outBtn').style.opacity=r.pulang?.5:1;
 let rows=Object.entries(data[current]||{}).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,10);
 document.getElementById('history').innerHTML=rows.length?rows.map(([d,r])=>{
   let pending = (r.masuk && !r.masukSynced) || (r.pulang && !r.pulangSynced);
   let badge = pending ? '<span class="sync sync-pending">belum sinkron</span>' : '<span class="sync sync-ok">tersinkron</span>';
   return `<div class="row"><span>${d}</span><span>${r.masuk||'-'} / ${r.pulang||'-'} ${badge}</span></div>`;
 }).join(''):'<div class="small">Belum ada riwayat.</div>';
 let month=new Date().toISOString().slice(0,7), n=Object.keys(data[current]||{}).filter(x=>x.startsWith(month)&&data[current][x].masuk).length;
 document.getElementById('countH').textContent=n;document.getElementById('countD').textContent=Object.keys(data[current]||{}).filter(x=>x.startsWith(month)).length;
}

function attendance(type){
 let k=key();data[current]??={};data[current][k]??={};
 if(data[current][k][type]) return alert('Absensi '+type+' sudah tercatat.');
 let jam = now();
 data[current][k][type]=jam;
 data[current][k][type+'Synced']=false;
 localStorage.setItem(KEY,JSON.stringify(data));
 render();
 alert('Absensi '+type+' berhasil dicatat pada '+jam+'.');
 sendToSheet(current, k, type, jam);
}

function sendToSheet(nama, tanggal, jenis, jam, coords){
 if(!CONFIG.SCRIPT_URL || CONFIG.SCRIPT_URL.indexOf('PASTE_URL') === 0){
   updateNetStatus(false, 'Belum terhubung ke Sheets');
   return;
 }
 fetch(CONFIG.SCRIPT_URL, {
   method: 'POST',
   headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // hindari CORS preflight ke Apps Script
   body: JSON.stringify({ nama, tanggal, jenis, jam, lat: coords?.lat || '', lng: coords?.lng || '' })
 }).then(r => r.json()).then(res => {
   if(res && res.ok){
     data[nama][tanggal][jenis+'Synced'] = true;
     localStorage.setItem(KEY, JSON.stringify(data));
     render();
     updateNetStatus(true);
   } else {
     updateNetStatus(false, res && res.message ? res.message : 'Gagal sinkron');
   }
 }).catch(() => updateNetStatus(false, 'Tidak ada koneksi'));
}

function syncPending(manual){
 if(!CONFIG.SCRIPT_URL || CONFIG.SCRIPT_URL.indexOf('PASTE_URL') === 0){
   if(manual) alert('URL Google Apps Script belum diisi di bagian CONFIG pada kode index.html.');
   return;
 }
 let found = false;
 Object.entries(data[current]||{}).forEach(([tanggal, r]) => {
   ['masuk','pulang'].forEach(jenis => {
     if(r[jenis] && !r[jenis+'Synced']){
       found = true;
       sendToSheet(current, tanggal, jenis, r[jenis]);
     }
   });
 });
 if(manual && !found) alert('Semua data sudah tersinkron.');
}

function updateNetStatus(ok, msg){
 let el = document.getElementById('netStatus');
 if(!el) return;
 el.textContent = ok ? 'Tersinkron' : (msg || 'Belum sinkron');
 el.className = 'sync ' + (ok ? 'sync-ok' : 'sync-pending');
}

function locationInfo(){
 if(!navigator.geolocation)return alert('Browser tidak mendukung GPS.');
 navigator.geolocation.getCurrentPosition(p=>alert('Lokasi terdeteksi.\nLatitude: '+p.coords.latitude+'\nLongitude: '+p.coords.longitude),()=>alert('Izin lokasi belum diberikan.'));
}
function logout(){localStorage.removeItem(USER);location.reload()}
setInterval(()=>document.getElementById('clock').textContent=now(),1000);document.getElementById('clock').textContent=now();
window.addEventListener('online', () => syncPending(false));
if(current)showApp();
</script>
</body></html>
